name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            cmake_args: -G Xcode
          - name: Windows
            os: windows-latest
            cmake_args: -A x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Configure
        run: cmake -S . -B build ${{ matrix.cmake_args }}

      - name: Build Release
        run: cmake --build build --config Release --target DuganAutomixer_Standalone
